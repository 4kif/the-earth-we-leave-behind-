<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Showcase — The Earth We Leave Behind</title>

    <link rel="stylesheet" href="showcase.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <a href="index.html" class="logo-link">
            <div class="logo">
                <img src="logo.png" alt="Earth Logo">
                <span>EARTH<span class="green">.</span></span>
            </div>
        </a>

        <div class="nav-right">

            <span class="page-number">
                08 / SHOWCASE
            </span>

            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </nav>


    <!-- =========================
         MENU
    ========================= -->

    <div class="menu-panel" id="menuPanel">

        <div class="menu-label">
            MENU
        </div>

        <a href="index.html">
            <span>01</span>
            Home
        </a>

        <a href="team.html">
            <span>02</span>
            Our Team
        </a>

        <a href="contact.html">
            <span>03</span>
            Contact
        </a>

    </div>


    <!-- =========================
         SHOWCASE
    ========================= -->

    <main class="showcase">

        <!-- Background -->
        <div class="background-text">
            EARTH
        </div>


        <!-- VIDEO -->

        <div class="video-container">

            <video
                id="showcaseVideo"
                class="showcase-video"
                autoplay
                muted
                loop
                playsinline
                poster="showcase-poster.pdf"
            >

                <source src="climate-video.mp4" type="video/mp4">

                Your browser does not support the video tag.

            </video>


            <!-- Video overlay -->

            <div class="video-overlay"></div>


            <!-- Play button -->

            <button class="play-button" id="playButton">

                <span id="playIcon">
                    ▶
                </span>

            </button>


            <!-- Video label -->

            <div class="video-label">
                <span class="live-dot"></span>
                VISUAL STORY
            </div>

        </div>


        <!-- =========================
             TITLE
        ========================= -->

        <div class="showcase-title">

            <p class="eyebrow">
                08 — SHOWCASE
            </p>

            <h1>
                THE EARTH WE LEAVE
                <span>BEHIND.</span>
            </h1>

            <p class="description">
                A visual journey through the changing planet,
                the consequences of our choices and the future
                we still have the power to shape.
            </p>

        </div>


        <!-- =========================
             BOTTOM
        ========================= -->

        <div class="showcase-bottom">

            <a href="climate-data.html" class="next-button">
                NEXT
                <span>→</span>
            </a>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           HAMBURGER MENU
        ========================= */

        const menuToggle = document.getElementById("menuToggle");
        const menuPanel = document.getElementById("menuPanel");

        menuToggle.addEventListener("click", function () {

            menuToggle.classList.toggle("active");
            menuPanel.classList.toggle("active");

        });


        /* =========================
           VIDEO PLAY / PAUSE
        ========================= */

        const video = document.getElementById("showcaseVideo");
        const playButton = document.getElementById("playButton");
        const playIcon = document.getElementById("playIcon");

        playButton.addEventListener("click", function () {

            if (video.paused) {

                video.play();

                playIcon.textContent = "Ⅱ";

                playButton.classList.add("playing");

            } else {

                video.pause();

                playIcon.textContent = "▶";

                playButton.classList.remove("playing");

            }

        });


        /* =========================
           HIDE PLAY BUTTON WHILE PLAYING
        ========================= */

        video.addEventListener("play", function () {

            playIcon.textContent = "Ⅱ";

        });

        video.addEventListener("pause", function () {

            playIcon.textContent = "▶";

        });

    </script>

</body>
</html>
