<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Connect — The Earth We Leave Behind</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
```

</head>

<body>

```
<!-- =========================
     CONTACT / THE LAST MESSAGE
========================== -->

<section class="last-message">

    <div class="last-message-content">

        <p class="last-label">
            05 — CONNECT
        </p>

        <h1>
            BEFORE YOU<br>
            <span>LEAVE...</span>
        </h1>

        <div class="message-line"></div>

        <h2>
            WHAT WILL YOU<br>
            LEAVE BEHIND?
        </h2>

        <p class="message-description">
            The future is shaped by the choices we make today.
            Every action leaves a mark.
        </p>

    </div>


    <!-- =========================
         SOCIAL LINKS
    ========================== -->

    <div class="connect-box">

        <p class="connect-label">
            LET'S CONNECT
        </p>


        <!-- INSTAGRAM -->

        <a
            href="YOUR_INSTAGRAM_LINK"
            target="_blank"
            class="connect-link"
        >

            <div>
                <span class="platform-number">01</span>

                <span class="platform-name">
                    INSTAGRAM
                </span>
            </div>

            <span class="arrow">↗</span>

        </a>


        <!-- TIKTOK -->

        <a
            href="YOUR_TIKTOK_LINK"
            target="_blank"
            class="connect-link"
        >

            <div>
                <span class="platform-number">02</span>

                <span class="platform-name">
                    TIKTOK
                </span>
            </div>

            <span class="arrow">↗</span>

        </a>

    </div>


    <div class="last-message-footer">
        EVERY ACTION LEAVES A MARK.
    </div>

</section>
```

</body>
</html>
