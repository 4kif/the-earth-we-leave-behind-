<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climate Data</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            THE EARTH WE LEAVE BEHIND
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="climate-data.html">Climate Data</a>
        </div>

    </nav>


    <main>

        <section class="data-hero">

            <p class="small-title">
                CLIMATE CHANGE DATA
            </p>

            <h1>
                The Earth Is Changing
            </h1>

            <p>
                Temperature, sea level, CO₂ emissions and forest loss.
            </p>

        </section>


        <section class="graph-section">

            <p class="section-label">
                GLOBAL CLIMATE INDICATORS
            </p>

            <h2>
                Climate Change in One View
            </h2>

            <p class="description">
                A comparison of major environmental indicators
                over time.
            </p>


            <div class="graph-card">

                <div class="chart-wrapper">

                    <canvas id="climateChart"></canvas>

                </div>

            </div>

        </section>

    </main>


    <script>

        const ctx =
            document.getElementById("climateChart");


        new Chart(ctx, {

            type: "line",

            data: {

                labels: [
                    "2000",
                    "2005",
                    "2010",
                    "2015",
                    "2020",
                    "2025"
                ],

                datasets: [

                    {
                        label: "Temperature",

                        data: [
                            100,
                            114,
                            133,
                            176,
                            233,
                            267
                        ],

                        borderColor: "#39ff88",

                        borderWidth: 3,

                        tension: 0.4,

                        pointRadius: 4

                    },

                    {
                        label: "Sea Level",

                        data: [
                            100,
                            118,
                            135,
                            155,
                            178,
                            205
                        ],

                        borderColor: "#38bdf8",

                        borderWidth: 3,

                        tension: 0.4,

                        pointRadius: 4

                    },

                    {
                        label: "CO₂ Emissions",

                        data: [
                            100,
                            116,
                            132,
                            140,
                            136,
                            152
                        ],

                        borderColor: "#ff4d6d",

                        borderWidth: 3,

                        tension: 0.4,

                        pointRadius: 4

                    },

                    {
                        label: "Forest Loss",

                        data: [
                            100,
                            111,
                            133,
                            156,
                            189,
                            200
                        ],

                        borderColor: "#f59e0b",

                        borderWidth: 3,

                        tension: 0.4,

                        pointRadius: 4

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },

                plugins: {

                    legend: {

                        position: "top"

                    }

                }

            }

        });

    </script>

</body>

</html>
